<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Island Profile Editor</title>
  <link rel="stylesheet" href="profile-editor.css">
</head>
<body>
  <h1>Island Profile Editor</h1>

  <div class="top">
    <select id="style-select"></select>
    <button id="copy-btn">Copy constants</button>
    <label class="paste-label"><span class="paste-area"><textarea class="paste-input" rows="1"></textarea><span class="paste-hint">Paste constants</span></span></label>
    <button id="export-btn">Export SVG</button>
    <button id="theme-toggle" title="Toggle dark/light mode"></button>
    <span id="copy-msg"></span>
  </div>
  <div class="top save-row">
    <input type="text" id="save-name" placeholder="Custom profile name">
    <button id="save-btn">Save to browser</button>
    <button id="delete-btn" style="display:none">Delete</button>
  </div>

  <div class="main">
    <div class="canvas-wrap">
      <svg id="canvas" viewBox="-0.12 -0.12 1.24 1.24" width="500" height="500">
        <g id="grid"></g>
        <rect x="0" y="0" width="1" height="1" fill="none" stroke="#bbb" stroke-width="0.006"></rect>
        <path id="shape" fill="rgba(0,0,0,0.12)" stroke="#000" stroke-width="0.008" stroke-linejoin="round"></path>
      </svg>
    </div>
    <div class="sliders" id="sliders"></div>
  </div>

  <div class="code-out" id="code-out"></div>

  <script type="module">
    import { ISLAND_PROFILES, buildRadialIslandPath } from "./island-profiles.mjs";
    import { initProfileEditor } from "./profile-editor.mjs";

    initProfileEditor({
      profiles: ISLAND_PROFILES,
      lsKey: "qr-custom-island-profiles",
      defaultStyle: "flower5",
      buildPath: (_style, params) => buildRadialIslandPath(0.5, 0.5, params),
      sliderRange(name) {
        if (name === "points") return { min: 2, max: 48, step: 1 };
        if (name === "phase") return { min: 0, max: 1, step: 0.01 };
        if (name.endsWith("Open") || name.endsWith("Rotate")) return { min: -1, max: 1, step: 0.01 };
        return { min: 0, max: 1, step: 0.01 };
      },
      exportPrefix: "island",
    });
  </script>
  <script src="theme-toggle.js"></script>
</body>
</html>
