<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Island Profile Editor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font: 14px/1.4 system-ui, sans-serif; background: #f5f5f5; padding: 20px; }
    h1 { font-size: 18px; margin-bottom: 12px; }
    .top { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
    .top select, .top button { font: inherit; padding: 4px 8px; }
    .main { display: flex; gap: 24px; align-items: flex-start; }
    .canvas-wrap svg { background: white; border: 1px solid #ccc; border-radius: 4px; }
    .sliders { min-width: 280px; }
    .slider-row { margin-bottom: 8px; }
    .slider-row label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 2px; }
    .slider-row .val { font-family: monospace; color: #666; }
    .slider-row input[type="range"] { width: 100%; }
    .code-out { margin-top: 16px; font: 12px/1.5 monospace; background: #fff; border: 1px solid #ccc; border-radius: 4px; padding: 8px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Island Profile Editor</h1>

  <div class="top">
    <select id="style-select"></select>
    <button id="copy-btn">Copy constants</button>
    <button id="export-btn">Export SVG</button>
    <span id="copy-msg"></span>
  </div>

  <div class="main">
    <div class="canvas-wrap">
      <svg id="canvas" viewBox="-0.12 -0.12 1.24 1.24" width="500" height="500">
        <g id="grid"></g>
        <rect x="0" y="0" width="1" height="1" fill="none" stroke="#bbb" stroke-width="0.006"></rect>
        <path id="shape" fill="rgba(0,0,0,0.12)" stroke="#000" stroke-width="0.008" stroke-linejoin="round"></path>
      </svg>
    </div>
    <div class="sliders" id="sliders"></div>
  </div>

  <div class="code-out" id="code-out"></div>

  <script type="module">
    import { ISLAND_PROFILES, buildRadialIslandPath } from "./island-profiles.mjs";

    const DEFAULTS = JSON.parse(JSON.stringify(ISLAND_PROFILES));
    const styleSelect = document.getElementById("style-select");
    const slidersDiv = document.getElementById("sliders");
    const shapePath = document.getElementById("shape");
    const codeOut = document.getElementById("code-out");
    const copyBtn = document.getElementById("copy-btn");
    const copyMsg = document.getElementById("copy-msg");

    function buildStyleOptions(selected = "flower5") {
      const STYLE_ORDER = [
        ["star4", "Star 4"],
        ["diamond4", "Diamond 4"],
        ["flower5", "Flower 5"],
      ];

      styleSelect.innerHTML = "";
      for (const [name, label] of STYLE_ORDER) {
        if (!(name in ISLAND_PROFILES)) continue;
        const opt = document.createElement("option");
        opt.value = name;
        opt.textContent = label;
        opt.selected = name === selected;
        styleSelect.appendChild(opt);
      }
    }

    const g = document.getElementById("grid");
    let d = "";
    for (let i = 0; i <= 10; i++) {
      const v = i / 10;
      d += `M${v},-0.1V1.1 M-0.1,${v}H1.1 `;
    }
    const gridPath = document.createElementNS("http://www.w3.org/2000/svg", "path");
    gridPath.setAttribute("d", d);
    gridPath.setAttribute("stroke", "#e8e8e8");
    gridPath.setAttribute("stroke-width", "0.003");
    gridPath.setAttribute("fill", "none");
    g.appendChild(gridPath);

    function currentStyle() {
      return styleSelect.value;
    }

    function currentParams() {
      return ISLAND_PROFILES[currentStyle()];
    }

    function updateShape() {
      const params = currentParams();
      shapePath.setAttribute("d", buildRadialIslandPath(0.5, 0.5, params));
      codeOut.textContent = Object.entries(params)
        .map(([k, v]) => `${k}: ${typeof v === "number" ? v.toFixed(2) : v}`)
        .join(", ");
    }

    function sliderRangeFor(name) {
      if (name === "points") return { min: 2, max: 48, step: 1 };
      if (name === "phase") return { min: 0, max: 1, step: 0.01 };
      if (name.endsWith("Open") || name.endsWith("Rotate")) return { min: -1, max: 1, step: 0.01 };
      return { min: 0, max: 1, step: 0.01 };
    }

    function buildSliders() {
      slidersDiv.innerHTML = "";
      const style = currentStyle();
      const params = currentParams();
      const defaults = DEFAULTS[style];

      for (const [name, val] of Object.entries(params)) {
        if (typeof val !== "number") continue;

        const row = document.createElement("div");
        row.className = "slider-row";

        const label = document.createElement("label");
        const nameSpan = document.createElement("span");
        nameSpan.textContent = name;
        const valSpan = document.createElement("span");
        valSpan.className = "val";
        valSpan.textContent = val.toFixed(2);

        label.appendChild(nameSpan);
        label.appendChild(valSpan);

        const input = document.createElement("input");
        input.type = "range";
        const range = sliderRangeFor(name);
        input.min = range.min;
        input.max = range.max;
        input.step = range.step;
        input.value = String(val);

        input.addEventListener("input", () => {
          const v = parseFloat(input.value);
          params[name] = v;
          valSpan.textContent = v.toFixed(2);
          updateShape();
        });

        input.addEventListener("dblclick", () => {
          const v = defaults[name];
          params[name] = v;
          input.value = String(v);
          valSpan.textContent = v.toFixed(2);
          updateShape();
        });

        row.appendChild(label);
        row.appendChild(input);
        slidersDiv.appendChild(row);
      }
    }

    styleSelect.addEventListener("change", () => {
      buildSliders();
      updateShape();
    });

    copyBtn.addEventListener("click", () => {
      const text = Object.entries(currentParams())
        .map(([k, v]) => `${k}: ${typeof v === "number" ? v.toFixed(2) : v}`)
        .join(", ");
      navigator.clipboard.writeText(text).then(() => {
        copyMsg.textContent = "Copied!";
        setTimeout(() => copyMsg.textContent = "", 1500);
      });
    });

    document.getElementById("export-btn").addEventListener("click", () => {
      const d = buildRadialIslandPath(0.5, 0.5, currentParams());
      const svg = [
        `<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.15 -0.15 1.3 1.3" width="800" height="800">`,
        `<path d="${gridPath.getAttribute("d")}" stroke="#e0e0e0" stroke-width="0.003" fill="none"/>`,
        `<rect x="0" y="0" width="1" height="1" fill="none" stroke="#aaa" stroke-width="0.006"/>`,
        `<path d="${d}" fill="rgba(0,0,0,0.1)" stroke="#000" stroke-width="0.008"/>`,
        `</svg>`
      ].join("");

      const blob = new Blob([svg], { type: "image/svg+xml" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `island-${currentStyle()}.svg`;
      a.click();
      URL.revokeObjectURL(url);
    });

    buildStyleOptions();
    buildSliders();
    updateShape();
  </script>
</body>
</html>
