<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>QR Code Border Generator</title>
  <link rel="stylesheet" href="base.css">
  <link rel="preload" as="style" href="index.css" onload="rel='stylesheet'">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>QR Code Border Generator</h1>
      <button id="theme-toggle" title="Toggle dark/light mode"></button>
    </div>
    <div class="layout">
      <div class="controls">

        <div class="panel">
          <h2>QR Code</h2>
          <div class="field">
            <label>Text</label>
            <textarea id="text-input" placeholder="Enter text for QR code">https://example.com</textarea>
          </div>
          <div class="field">
            <label>Error correction</label>
            <div class="radio-group">
              <label><input type="radio" name="ecc" value="low" checked>Low</label>
              <label><input type="radio" name="ecc" value="medium">Medium</label>
              <label><input type="radio" name="ecc" value="quartile">Quartile</label>
              <label><input type="radio" name="ecc" value="high">High</label>
            </div>
          </div>
          <div class="field">
            <label>Version range</label>
            <div class="field-row">
              <input type="number" id="version-min" value="1" min="1" max="40" step="1">
              <span>to</span>
              <input type="number" id="version-max" value="40" min="1" max="40" step="1">
            </div>
          </div>
          <div class="field">
            <label>Mask pattern</label>
            <div class="field-row">
              <input type="number" id="mask-input" value="-1" min="-1" max="7" step="1">
              <span style="font-size:0.8rem;color:var(--heading-muted)">(-1 = auto)</span>
            </div>
          </div>
          <div class="checkbox-row">
            <input type="checkbox" id="boost-ecc" checked>
            <label for="boost-ecc">Boost ECC within same version</label>
          </div>
          <div class="separator"></div>
          <div class="field file-upload">
            <label>Or upload existing SVG</label>
            <input type="file" id="file-input" accept=".svg">
          </div>
        </div>

        <div class="panel">
          <h2>Border</h2>
          <div class="field">
            <label>Border shape</label>
            <div class="radio-group">
              <label><input type="radio" name="border-shape" value="circle" checked>Circle</label>
              <label><input type="radio" name="border-shape" value="square">Square</label>
            </div>
          </div>
          <div class="field" id="corner-radius-field" style="display:none">
            <label>Corner radius</label>
            <div class="field-row">
              <input type="range" id="corner-radius" min="0" max="1" step="0.01" value="0">
              <span class="range-value" id="corner-radius-value">0</span>
            </div>
          </div>
          <div class="checkbox-row">
            <input type="checkbox" id="snap-radius">
            <label for="snap-radius">Snap to integer radius</label>
          </div>
          <div class="field">
            <label>Size ratio</label>
            <div class="field-row">
              <input type="range" id="circle-ratio" min="0.5" max="1.3" step="0.01" value="0.82">
              <span class="range-value" id="circle-ratio-value">0.82</span>
            </div>
          </div>
          <div class="field">
            <label>Stroke width</label>
            <div class="field-row">
              <input type="range" id="stroke-width" min="0" max="5" step="0.25" value="2">
              <span class="range-value" id="stroke-width-value">2</span>
            </div>
          </div>
          <div class="field">
            <label>Interior color</label>
            <div class="field-row">
              <input type="color" id="fg-color" value="#000000" style="width:2.5em;height:2em;padding:0;border:1px solid #ccc;border-radius:4px;">
              <input type="range" id="fg-alpha" min="0" max="1" step="0.01" value="1">
              <span class="range-value" id="fg-alpha-value">1</span>
            </div>
          </div>
          <div class="field">
            <label>Border color</label>
            <div class="field-row">
              <input type="color" id="border-color" value="#000000" style="width:2.5em;height:2em;padding:0;border:1px solid #ccc;border-radius:4px;">
              <input type="range" id="border-alpha" min="0" max="1" step="0.01" value="1">
              <span class="range-value" id="border-alpha-value">1</span>
            </div>
          </div>
          <div class="checkbox-row">
            <input type="checkbox" id="border2-enabled">
            <label for="border2-enabled">Second border</label>
          </div>
          <div id="border2-fields" style="display:none">
            <div class="field">
              <label>Second border color</label>
              <div class="field-row">
                <input type="color" id="border2-color" value="#ffffff" style="width:2.5em;height:2em;padding:0;border:1px solid #ccc;border-radius:4px;">
              <input type="range" id="border2-alpha" min="0" max="1" step="0.01" value="1">
              <span class="range-value" id="border2-alpha-value">1</span>
              </div>
            </div>
            <div class="field">
              <label>Second border width</label>
              <div class="field-row">
                <input type="range" id="border2-width" min="0" max="10" step="0.25" value="4">
                <span class="range-value" id="border2-width-value">4</span>
              </div>
            </div>
            <div class="field">
              <label>Second border offset</label>
              <div class="field-row">
                <input type="range" id="border2-offset" min="-5" max="5" step="0.25" value="0">
                <span class="range-value" id="border2-offset-value">0</span>
              </div>
            </div>
            <div class="checkbox-row">
              <input type="checkbox" id="border2-trim">
              <label for="border2-trim">Trim fluff at border</label>
            </div>
          </div>
          <div class="field">
            <label>Background color</label>
            <div class="field-row">
              <input type="color" id="bg-color" value="#ffffff" style="width:2.5em;height:2em;padding:0;border:1px solid #ccc;border-radius:4px;">
              <input type="range" id="bg-alpha" min="0" max="1" step="0.01" value="1">
              <span class="range-value" id="bg-alpha-value">1</span>
            </div>
          </div>
          <div class="field">
            <label>Background shape</label>
            <div class="radio-group">
              <label><input type="radio" name="bg-shape" value="rect">Rectangle</label>
              <label><input type="radio" name="bg-shape" value="circle" checked>Border</label>
            </div>
          </div>
          <div class="field">
            <label>Fluff gap</label>
            <div class="field-row">
              <input type="range" id="gap" min="0" max="5" step="1" value="1">
              <span class="range-value" id="gap-value">1</span>
            </div>
          </div>
          <div class="field">
            <label>Flank gap</label>
            <div class="field-row">
              <input type="range" id="flank-gap" min="0" max="5" step="1" value="1">
              <span class="range-value" id="flank-gap-value">1</span>
            </div>
          </div>
          <div class="checkbox-row">
            <input type="checkbox" id="shuffle">
            <label for="shuffle">Shuffle fluff</label>
          </div>
          <div class="checkbox-row">
            <input type="checkbox" id="rand-align" checked>
            <label for="rand-align">Randomize alignments</label>
          </div>
          <div class="checkbox-row">
            <input type="checkbox" id="rand-fluff">
            <label for="rand-fluff">Random fluff</label>
          </div>
          <div class="checkbox-row">
            <input type="checkbox" id="no-fluff">
            <label for="no-fluff">No fluff</label>
          </div>
          <div class="checkbox-row">
            <input type="checkbox" id="obfuscate">
            <label for="obfuscate">Obfuscate (puzzle)</label>
          </div>
          <div id="obfuscate-fields" style="display:none">
            <div class="field">
              <label>Top-left finder</label>
              <div class="field-row">
                <input type="range" id="obf-tl" min="0" max="1" step="0.01" value="0">
                <span class="range-value" id="obf-tl-value">0</span>
              </div>
            </div>
            <div class="field">
              <label>Top-right finder</label>
              <div class="field-row">
                <input type="range" id="obf-tr" min="0" max="1" step="0.01" value="0">
                <span class="range-value" id="obf-tr-value">0</span>
              </div>
            </div>
            <div class="field">
              <label>Bottom-left finder</label>
              <div class="field-row">
                <input type="range" id="obf-bl" min="0" max="1" step="0.01" value="0">
                <span class="range-value" id="obf-bl-value">0</span>
              </div>
            </div>
            <div class="field">
              <label>Alignment patterns</label>
              <div class="field-row">
                <input type="range" id="obf-align" min="0" max="1" step="0.01" value="0">
                <span class="range-value" id="obf-align-value">0</span>
              </div>
            </div>
            <div class="checkbox-row">
              <input type="checkbox" id="obf-dark-only">
              <label for="obf-dark-only">Dark regions only</label>
            </div>
            <div class="checkbox-row">
              <input type="checkbox" id="obf-border">
              <label for="obf-border">Overlay border</label>
            </div>
            <div class="field">
              <label>Overlay tint</label>
              <input type="text" id="obf-tint" value="rgba(0,0,30,0.1)">
            </div>
          </div>
          <div class="checkbox-row">
            <input type="checkbox" id="rounded-pixels">
            <label for="rounded-pixels">Rounded pixels</label>
          </div>
          <div id="rounded-pixels-fields" style="display:none">
            <div class="field">
              <label>Outer radius</label>
              <div class="field-row">
                <input type="range" id="rounded-radius" min="0" max="0.5" step="0.01" value="0.3">
                <span class="range-value" id="rounded-radius-value">0.3</span>
              </div>
            </div>
            <div class="field">
              <label>Inner radius</label>
              <div class="field-row">
                <input type="range" id="rounded-inner" min="0" max="0.5" step="0.01" value="0.3">
                <span class="range-value" id="rounded-inner-value">0.3</span>
              </div>
            </div>
            <div class="checkbox-row">
              <input type="checkbox" id="full-l-corners">
              <label for="full-l-corners">Full-radius L-corners</label>
            </div>
            <div class="checkbox-row" id="skip-checker-l-corners-row" style="display:none; padding-left: 1.5em;">
              <input type="checkbox" id="skip-checker-l-corners">
              <label for="skip-checker-l-corners">Skip at diagonal neighbors</label>
            </div>
            <div class="checkbox-row">
              <input type="checkbox" id="contour-mode">
              <label for="contour-mode">Contour tracing</label>
            </div>
            <div class="checkbox-row">
              <input type="checkbox" id="clean-path-mode">
              <label for="clean-path-mode">Clean path</label>
            </div>
            <div class="field">
              <label>Connect diagonals</label>
              <div class="field-row">
                <input type="range" id="connect-diagonals" min="0" max="5" step="0.25" value="0">
                <span class="range-value" id="connect-diagonals-value">Off</span>
                <select id="cd-order">
                  <option value="default">Islands first</option>
                  <option value="reverse">Bays first</option>
                  <option value="random">Random</option>
                </select>
              </div>
            </div>
            <div class="checkbox-row">
              <input type="checkbox" id="diag-only">
              <label for="diag-only">Suppress corners at diagonals</label>
            </div>
            <div class="field">
              <label>Tip style <a href="tip-editor.html" target="_blank" class="edit-link">Edit…</a></label>
              <select id="tip-style"></select>
            </div>
            <div id="tip-mix-sliders" style="display:none"></div>
            <div class="field">
              <label>Tip base</label>
              <div class="field-row">
                <input type="range" id="tip-base" min="0" max="0.9" step="0.05" value="0">
                <output id="tip-base-val">0</output>
              </div>
            </div>
            <div class="field">
              <label>Island style <a href="island-editor.html" target="_blank" class="edit-link">Edit…</a></label>
              <select id="island-style"></select>
            </div>
            <div id="island-mix-sliders" style="display:none"></div>
            <div class="field">
              <label>Jiggle</label>
              <div class="field-row">
                <input type="range" id="jiggle" min="0" max="1" step="0.01" value="0">
                <span class="range-value" id="jiggle-value">0</span>
              </div>
            </div>
            <div class="field">
              <label>Wobble freq</label>
              <div class="field-row">
                <input type="range" id="wobble-freq" min="0" max="0.2" step="0.001" value="0">
                <span class="range-value" id="wobble-freq-value">0</span>
              </div>
            </div>
            <div class="field">
              <label>Wobble octaves</label>
              <div class="field-row">
                <input type="range" id="wobble-octaves" min="1" max="5" step="1" value="3">
                <span class="range-value" id="wobble-octaves-value">3</span>
              </div>
            </div>
            <div class="field">
              <label>Wobble scale</label>
              <div class="field-row">
                <input type="range" id="wobble-scale" min="0" max="2" step="0.01" value="0">
                <span class="range-value" id="wobble-scale-value">0</span>
              </div>
            </div>
          </div>
          <div class="checkbox-row">
            <input type="checkbox" id="colorful">
            <label for="colorful">Debug (colorful)</label>
          </div>
        </div>

        <div class="btn-row">
          <button class="btn btn-primary" id="download-btn">Download SVG</button>
          <div class="repro-menu" id="repro-menu">
            <button class="btn btn-secondary" id="repro-btn">Repro JSON</button>
            <div class="repro-dropdown">
              <button class="repro-item" id="repro-copy">Copy</button>
              <button class="repro-item" id="repro-download">Download</button>
              <button class="repro-item" id="repro-open">Open file...</button>
              <label class="repro-item repro-paste-label">
                <span class="repro-paste-area">
                  <textarea class="repro-paste-input" rows="1"></textarea>
                  <span class="repro-paste-hint">Paste JSON</span>
                </span>
              </label>
            </div>
            <input type="file" id="repro-file-input" accept=".json" style="display:none">
          </div>
        </div>
      </div>

      <div class="preview">
        <div id="preview-svg"></div>
        <div class="stats" id="stats"></div>
        <div class="step-controls" id="step-controls" style="margin-top:0.5rem;display:none;align-items:center;gap:0.5rem;width:100%;max-width:500px;">
          <button id="step-play" class="btn btn-secondary" style="flex:none;width:2.2em;height:2.2em;padding:0;font-size:1rem;">&#9654;</button>
          <input type="range" id="step-slider" min="0" max="10" value="10" style="flex:1;">
          <span id="step-label" style="font-size:0.8rem;color:var(--heading-muted);min-width:5em;text-align:right;">All</span>
        </div>
      </div>
    </div>
  </div>
  <script src="theme-toggle.js"></script>
  <script src="qrcodegen.js"></script>
  <script type="module" src="index.mjs"></script>
</body>
</html>
