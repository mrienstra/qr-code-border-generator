<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tip Profile Editor</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font: 14px/1.4 system-ui, sans-serif; background: #f5f5f5; padding: 20px; }
  h1 { font-size: 18px; margin-bottom: 12px; }
  .top { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
  .top select { font: inherit; padding: 4px 8px; }
  .top button { font: inherit; padding: 4px 12px; cursor: pointer; }
  .top input[type=text] { font: inherit; padding: 4px 8px; width: 140px; }
  .main { display: flex; gap: 24px; align-items: flex-start; }
  .canvas-wrap { flex-shrink: 0; }
  .canvas-wrap svg { background: white; border: 1px solid #ccc; border-radius: 4px; }
  .sliders { min-width: 260px; }
  .slider-row { margin-bottom: 8px; }
  .slider-row label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 2px; }
  .slider-row label .val { font-family: monospace; color: #666; }
  .slider-row input[type=range] { width: 100%; }
  .code-out { margin-top: 16px; font: 12px/1.5 monospace; background: #fff; border: 1px solid #ccc;
    border-radius: 4px; padding: 8px; white-space: pre-wrap; word-break: break-all; min-height: 40px; }
  .copied { color: #2a2; font-weight: bold; }
  .save-row { display: flex; align-items: center; gap: 8px; }
</style>
</head>
<body>

<h1>Tip Profile Editor</h1>

<div class="top">
  <select id="style-select"></select>
  <button id="copy-btn">Copy constants</button>
  <button id="export-btn">Export SVG</button>
  <button id="delete-btn" style="display:none">Delete custom</button>
  <span id="copy-msg"></span>
</div>
<div class="top save-row">
  <input type="text" id="save-name" placeholder="Custom profile name">
  <button id="save-btn">Save to browser</button>
</div>

<div class="main">
  <div class="canvas-wrap">
    <svg id="canvas" viewBox="-0.12 -0.12 1.24 1.24" width="500" height="500">
      <!-- grid -->
      <g id="grid"></g>
      <!-- module box -->
      <rect x="0" y="0" width="1" height="1" fill="none" stroke="#bbb" stroke-width="0.006"/>
      <!-- tip shape -->
      <path id="shape" fill="rgba(0,0,0,0.12)" stroke="#000" stroke-width="0.008" stroke-linejoin="round"/>
    </svg>
  </div>
  <div class="sliders" id="sliders"></div>
</div>

<div class="code-out" id="code-out"></div>

<script type="module">
import { TIP_PROFILES, buildLobedTipPath } from "./per-pixel-paths.mjs";

const LS_KEY = "qr-custom-tip-profiles";
const BUILTIN_NAMES = new Set(Object.keys(TIP_PROFILES));

// Load custom profiles from localStorage
function loadCustomProfiles() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return {};
    return JSON.parse(raw);
  } catch { return {}; }
}

function saveCustomProfiles(customs) {
  localStorage.setItem(LS_KEY, JSON.stringify(customs));
}

// Inject custom profiles into TIP_PROFILES
const customProfiles = loadCustomProfiles();
for (const [name, profile] of Object.entries(customProfiles)) {
  TIP_PROFILES[name] = profile;
}

// Deep-copy defaults so we can reset
const DEFAULTS = JSON.parse(JSON.stringify(TIP_PROFILES));

const styleSelect = document.getElementById("style-select");
const slidersDiv = document.getElementById("sliders");
const shapePath = document.getElementById("shape");
const codeOut = document.getElementById("code-out");
const copyBtn = document.getElementById("copy-btn");
const copyMsg = document.getElementById("copy-msg");
const saveNameInput = document.getElementById("save-name");
const saveBtn = document.getElementById("save-btn");
const deleteBtn = document.getElementById("delete-btn");

// Build grid lines
{
  const g = document.getElementById("grid");
  let d = "";
  for (let i = 0; i <= 10; i++) {
    const v = i / 10;
    d += `M${v},-0.1V1.1 M-0.1,${v}H1.1 `;
  }
  const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
  path.setAttribute("d", d);
  path.setAttribute("stroke", "#e8e8e8");
  path.setAttribute("stroke-width", "0.003");
  path.setAttribute("fill", "none");
  g.appendChild(path);
}

function buildPath(style, params) {
  const f = v => {
    if (v === Math.round(v)) return String(Math.round(v));
    return v.toFixed(4).replace(/0+$/, "").replace(/\.$/, "");
  };
  const base = params.base || 0;
  const s = 1 - base;                          // v-scale for curves
  const p  = (u, v) => `${f(u)},${f(v)}`;      // unscaled (for walls)
  const ps = (u, v) => `${f(u)},${f(v * s)}`;  // scaled (for curves)

  if (params.lobes) {
    return buildLobedTipPath(p, ps, params);
  } else {
    const { a, b } = params;
    return [
      `M${p(0, 1)}`,
      `L${p(1, 1)}`,
      `L${ps(1, 1)}`,
      `C${ps(1, a)},${ps(b, 0)},${ps(0.5, 0)}`,
      `C${ps(1 - b, 0)},${ps(0, a)},${ps(0, 1)}`,
      `L${p(0, 1)}`,
      `Z`
    ].join(" ");
  }
}

function currentStyle() { return styleSelect.value; }
function currentParams() { return TIP_PROFILES[currentStyle()]; }

function updateShape() {
  const style = currentStyle();
  const params = currentParams();
  shapePath.setAttribute("d", buildPath(style, params));

  // Update code output
  const parts = Object.entries(params).map(([k, v]) => `${k}: ${parseFloat(v.toFixed(2)).toString()}`);
  codeOut.textContent = parts.join(", ");

  // Show/hide delete button for custom profiles
  deleteBtn.style.display = !BUILTIN_NAMES.has(style) ? "" : "none";
}

function labelForStyle(name) {
  return name
    .split("-")
    .map((part) => part.charAt(0).toUpperCase() + part.slice(1))
    .join(" ");
}

function buildStyleOptions(selected = "paw") {
  styleSelect.innerHTML = "";

  // Built-in profiles
  for (const name of BUILTIN_NAMES) {
    const opt = document.createElement("option");
    opt.value = name;
    opt.textContent = labelForStyle(name);
    if (name === selected) opt.selected = true;
    styleSelect.appendChild(opt);
  }

  // Custom profiles
  const customNames = Object.keys(TIP_PROFILES).filter(n => !BUILTIN_NAMES.has(n));
  if (customNames.length) {
    const sep = document.createElement("option");
    sep.disabled = true;
    sep.textContent = "--- Custom ---";
    styleSelect.appendChild(sep);
    for (const name of customNames) {
      const opt = document.createElement("option");
      opt.value = name;
      opt.textContent = labelForStyle(name);
      if (name === selected) opt.selected = true;
      styleSelect.appendChild(opt);
    }
  }
}

function buildSliders() {
  slidersDiv.innerHTML = "";
  const style = currentStyle();
  const params = currentParams();
  const defaults = DEFAULTS[style];

  for (const [name, val] of Object.entries(params)) {
    const row = document.createElement("div");
    row.className = "slider-row";

    const label = document.createElement("label");
    const nameSpan = document.createElement("span");
    nameSpan.textContent = name;
    const valSpan = document.createElement("span");
    valSpan.className = "val";
    valSpan.textContent = val.toFixed(2);
    label.appendChild(nameSpan);
    label.appendChild(valSpan);

    const input = document.createElement("input");
    input.type = "range";
    if (name === "lobes") {
      input.min = "0";
      input.max = "12";
      input.step = "1";
    } else if (/(Open|Rotate)$/.test(name)) {
      input.min = "-1";
      input.max = "1";
      input.step = "0.02";
    } else {
      input.min = "0";
      input.max = "1";
      input.step = "0.01";
    }
    input.value = String(val);

    input.addEventListener("input", () => {
      const v = parseFloat(input.value);
      params[name] = v;
      valSpan.textContent = v.toFixed(2);
      updateShape();
    });

    // Double-click to reset to default
    if (defaults) {
      input.addEventListener("dblclick", () => {
        const v = defaults[name];
        input.value = String(v);
        params[name] = v;
        valSpan.textContent = v.toFixed(2);
        updateShape();
      });
    }

    row.appendChild(label);
    row.appendChild(input);
    slidersDiv.appendChild(row);
  }
}

// Init
buildStyleOptions("paw");
buildSliders();
updateShape();

styleSelect.addEventListener("change", () => {
  buildSliders();
  updateShape();
});

// Save custom profile
saveBtn.addEventListener("click", () => {
  const name = saveNameInput.value.trim().toLowerCase().replace(/\s+/g, "-").replace(/[^a-z0-9-]/g, "");
  if (!name) { copyMsg.textContent = "Enter a name"; setTimeout(() => copyMsg.textContent = "", 1500); return; }
  if (BUILTIN_NAMES.has(name)) { copyMsg.textContent = "Can't overwrite built-in"; setTimeout(() => copyMsg.textContent = "", 1500); return; }

  // Clone current params
  const params = JSON.parse(JSON.stringify(currentParams()));
  TIP_PROFILES[name] = params;
  DEFAULTS[name] = JSON.parse(JSON.stringify(params));

  // Persist to localStorage
  const customs = loadCustomProfiles();
  customs[name] = params;
  saveCustomProfiles(customs);

  buildStyleOptions(name);
  buildSliders();
  updateShape();
  copyMsg.textContent = "Saved!";
  copyMsg.className = "copied";
  setTimeout(() => { copyMsg.textContent = ""; }, 1500);
});

// Delete custom profile
deleteBtn.addEventListener("click", () => {
  const name = currentStyle();
  if (BUILTIN_NAMES.has(name)) return;

  delete TIP_PROFILES[name];
  delete DEFAULTS[name];

  const customs = loadCustomProfiles();
  delete customs[name];
  saveCustomProfiles(customs);

  buildStyleOptions("paw");
  buildSliders();
  updateShape();
  copyMsg.textContent = "Deleted!";
  setTimeout(() => { copyMsg.textContent = ""; }, 1500);
});

copyBtn.addEventListener("click", () => {
  const params = currentParams();
  const parts = Object.entries(params).map(([k, v]) => `${k} = ${v.toFixed(2)}`);
  const text = parts.join(", ");
  navigator.clipboard.writeText(text).then(() => {
    copyMsg.textContent = "Copied!";
    copyMsg.className = "copied";
    setTimeout(() => { copyMsg.textContent = ""; }, 1500);
  });
});

document.getElementById("export-btn").addEventListener("click", () => {
  const style = currentStyle();
  const d = buildPath(style, currentParams());

  // Build a standalone SVG with grid + path
  let grid = "";
  for (let i = 0; i <= 10; i++) {
    const v = (i / 10).toFixed(1);
    grid += `M${v},-0.1V1.1 M-0.1,${v}H1.1 `;
  }

  const svg = [
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.15 -0.15 1.3 1.3" width="800" height="800">`,
    `  <path d="${grid.trim()}" stroke="#e0e0e0" stroke-width="0.003" fill="none"/>`,
    `  <rect x="0" y="0" width="1" height="1" fill="none" stroke="#aaa" stroke-width="0.006"/>`,
    `  <path d="${d}" fill="rgba(0,0,0,0.1)" stroke="#000" stroke-width="0.008"/>`,
    `</svg>`
  ].join("\n");

  const blob = new Blob([svg], { type: "image/svg+xml" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `tip-${style}.svg`;
  a.click();
  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
