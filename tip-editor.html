<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tip Profile Editor</title>
<link rel="stylesheet" href="profile-editor.css">
</head>
<body>

<h1>Tip Profile Editor</h1>

<div class="top">
  <select id="style-select"></select>
  <button id="copy-btn">Copy constants</button>
  <label class="paste-label"><span class="paste-area"><textarea class="paste-input" rows="1"></textarea><span class="paste-hint">Paste constants</span></span></label>
  <button id="export-btn">Export SVG</button>
  <button id="theme-toggle" title="Toggle dark/light mode"></button>
  <span id="copy-msg"></span>
</div>
<div class="top save-row">
  <input type="text" id="save-name" placeholder="Custom profile name">
  <button id="save-btn">Save to browser</button>
  <button id="delete-btn" style="display:none">Delete</button>
</div>

<div class="main">
  <div class="canvas-wrap">
    <svg id="canvas" viewBox="-0.12 -0.12 1.24 1.24" width="500" height="500">
      <g id="grid"></g>
      <rect x="0" y="0" width="1" height="1" fill="none" stroke="#bbb" stroke-width="0.006"/>
      <path id="shape" fill="rgba(0,0,0,0.12)" stroke="#000" stroke-width="0.008" stroke-linejoin="round"/>
    </svg>
  </div>
  <div class="sliders" id="sliders"></div>
</div>

<div class="code-out" id="code-out"></div>

<script type="module">
import { TIP_PROFILES, buildLobedTipPath } from "./per-pixel-paths.mjs";
import { initProfileEditor } from "./profile-editor.mjs";

function buildPath(_style, params) {
  const f = v => {
    if (v === Math.round(v)) return String(Math.round(v));
    return v.toFixed(4).replace(/0+$/, "").replace(/\.$/, "");
  };
  const base = params.base || 0;
  const s = 1 - base;
  const p  = (u, v) => `${f(u)},${f(v)}`;
  const ps = (u, v) => `${f(u)},${f(v * s)}`;

  if (params.lobes) {
    return buildLobedTipPath(p, ps, params);
  } else {
    const { a, b } = params;
    return [
      `M${p(0, 1)}`,
      `L${p(1, 1)}`,
      `L${ps(1, 1)}`,
      `C${ps(1, a)},${ps(b, 0)},${ps(0.5, 0)}`,
      `C${ps(1 - b, 0)},${ps(0, a)},${ps(0, 1)}`,
      `L${p(0, 1)}`,
      `Z`
    ].join(" ");
  }
}

initProfileEditor({
  profiles: TIP_PROFILES,
  lsKey: "qr-custom-tip-profiles",
  defaultStyle: "paw",
  buildPath,
  sliderRange(name) {
    if (name === "lobes") return { min: 0, max: 12, step: 1 };
    if (/(Open|Rotate)$/.test(name)) return { min: -1, max: 1, step: 0.02 };
    return { min: 0, max: 1, step: 0.01 };
  },
  exportPrefix: "tip",
  formatValue: (_k, v) => parseFloat(v.toFixed(2)).toString(),
});
</script>
<script src="theme-toggle.js"></script>
</body>
</html>
