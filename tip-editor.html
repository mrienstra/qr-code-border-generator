<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tip Profile Editor</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="profile-editor.css">
</head>
<body>

<h1>Tip Profile Editor</h1>

<div class="top">
  <select id="style-select"></select>
  <button id="copy-btn">Copy constants</button>
  <label class="paste-label"><span class="paste-area"><textarea class="paste-input" rows="1"></textarea><span class="paste-hint">Paste constants</span></span></label>
  <button id="export-btn">Export SVG</button>
  <button id="theme-toggle" title="Toggle dark/light mode"></button>
  <span id="copy-msg"></span>
</div>
<div class="top save-row">
  <input type="text" id="save-name" placeholder="Custom profile name">
  <button id="save-btn">Save to browser</button>
  <button id="delete-btn" style="display:none">Delete</button>
</div>

<div class="main">
  <div class="canvas-wrap">
    <svg id="canvas" viewBox="-0.12 -0.12 1.24 1.24" width="500" height="500">
      <g id="grid"></g>
      <g id="context-pixels"></g>
      <rect x="0" y="0" width="1" height="1" fill="none" stroke="#bbb" stroke-width="0.006"/>
      <path id="shape" fill="rgba(0,0,0,0.12)" stroke="#000" stroke-width="0.008" stroke-linejoin="round"/>
      <path id="fillets" fill="rgba(0,0,0,0.12)" stroke="none"/>
    </svg>
    <div class="context-controls">
      <label><input type="checkbox" id="ctx-b"> B</label>
      <label><input type="checkbox" id="ctx-bl"> BL</label>
      <label><input type="checkbox" id="ctx-br"> BR</label>
      <label class="ri-label">ri <input type="range" id="ctx-ri" min="0" max="0.5" step="0.01" value="0.25"><span id="ctx-ri-val">0.25</span></label>
      <label><input type="checkbox" id="ctx-no-stroke"> Hide strokes</label>
    </div>
  </div>
  <div class="sliders" id="sliders"></div>
</div>

<div class="code-out" id="code-out"></div>

<script type="module">
import { TIP_PROFILES, buildLobedTipPath } from "./per-pixel-paths.mjs";
import { initProfileEditor } from "./profile-editor.mjs";
import { innerFilletAt, buildFilletPath } from "./util/inner-fillet.mjs";

function buildPath(_style, params) {
  const f = v => {
    if (v === Math.round(v)) return String(Math.round(v));
    return v.toFixed(4).replace(/0+$/, "").replace(/\.$/, "");
  };
  const base = params.base || 0;
  const s = 1 - base;
  const p  = (u, v) => `${f(u)},${f(v)}`;
  const ps = (u, v) => `${f(u)},${f(v * s)}`;

  if (params.lobes) {
    return buildLobedTipPath(p, ps, params);
  } else {
    const { a, b } = params;
    return [
      `M${p(0, 1)}`,
      `L${p(1, 1)}`,
      `L${ps(1, 1)}`,
      `C${ps(1, a)},${ps(b, 0)},${ps(0.5, 0)}`,
      `C${ps(1 - b, 0)},${ps(0, a)},${ps(0, 1)}`,
      `L${p(0, 1)}`,
      `Z`
    ].join(" ");
  }
}

/**
 * Compute Bézier control-point handle pair for a lobed-tip node.
 * Replicates handlePair from buildLobedTipPath.
 */
function tipHandle(node) {
  const pull = node.pull ?? 0;
  if (!pull) return { in: [node.x, node.y], out: [node.x, node.y] };
  const open = Math.max(-1, Math.min(1, node.open ?? 0));
  const rotate = Math.max(-1, Math.min(1, node.rotate ?? 0));
  const t = Math.abs(open), axS = open < 0 ? -1 : 1;
  const ang = -Math.PI / 2 + rotate * (Math.PI / 2);
  const ax = Math.cos(ang), ay = Math.sin(ang), lx = -ay, ly = ax;
  const norm = (x, y) => { const m = Math.hypot(x, y) || 1; return [x / m, y / m]; };
  const [ix, iy] = norm(lx * (1 - t) + ax * axS * t, ly * (1 - t) + ay * axS * t);
  const [ox, oy] = norm(-lx * (1 - t) + ax * axS * t, -ly * (1 - t) + ay * axS * t);
  return {
    in:  [node.x + ix * pull, node.y + iy * pull],
    out: [node.x + ox * pull, node.y + oy * pull],
  };
}

/**
 * Find where horizontal line y=Y intersects the tip's edge cubic Bézier.
 * Works for both simple (a/b) and lobed tips.
 * Returns {px, py, tx, ty} compatible with buildFilletPath,
 * or null if Y is in the straight stem region.
 */
function findTipEdge(Y, params, side) {
  const base = params.base || 0;
  const s = 1 - base;
  if (Y >= s) return null; // stem region

  // Build the edge segment [P0..P3], oriented tip-to-base (t: 0→1 = top→bottom)
  let seg;
  if (params.lobes) {
    const { shoulder, peak1X, peak1Y } = params;
    const pull = params.peak1Pull ?? 0, open = params.peak1Open ?? 0, rot = params.peak1Rotate ?? 0;
    if (side === "left") {
      const n = { x: 1 - peak1X, y: peak1Y, pull, open, rotate: -rot };
      const h = tipHandle(n);
      seg = [[n.x, n.y * s], [h.out[0], h.out[1] * s], [0, (1 - shoulder) * s], [0, s]];
    } else {
      const n = { x: peak1X, y: peak1Y, pull, open, rotate: rot };
      const h = tipHandle(n);
      // Reverse the right shoulder segment so t goes tip→base
      seg = [[n.x, n.y * s], [h.in[0], h.in[1] * s], [1, (1 - shoulder) * s], [1, s]];
    }
  } else {
    const { a, b } = params;
    seg = side === "left"
      ? [[0.5, 0], [1 - b, 0], [0, a * s], [0, s]]
      : [[0.5, 0], [b, 0], [1, a * s], [1, s]];
  }

  // Scan line above the segment start → outside shoulder region
  if (Y < seg[0][1]) return null;

  // General cubic Bézier Newton solver: B_y(t) = Y
  const y0 = seg[0][1], y1 = seg[1][1], y2 = seg[2][1], y3 = seg[3][1];
  let t = 0.5;
  for (let i = 0; i < 20; i++) {
    const u = 1 - t;
    const By = u * u * u * y0 + 3 * u * u * t * y1 + 3 * u * t * t * y2 + t * t * t * y3;
    const f = By - Y;
    if (Math.abs(f) < 1e-10) break;
    const dBy = 3 * u * u * (y1 - y0) + 6 * u * t * (y2 - y1) + 3 * t * t * (y3 - y2);
    if (Math.abs(dBy) < 1e-12) break;
    t -= f / dBy;
    t = Math.max(0.001, Math.min(0.999, t));
  }

  const u = 1 - t;
  const x0 = seg[0][0], x1 = seg[1][0], x2 = seg[2][0], x3 = seg[3][0];
  const px = u * u * u * x0 + 3 * u * u * t * x1 + 3 * u * t * t * x2 + t * t * t * x3;
  const dx = 3 * u * u * (x1 - x0) + 6 * u * t * (x2 - x1) + 3 * t * t * (x3 - x2);
  const dy = 3 * u * u * (y1 - y0) + 6 * u * t * (y2 - y1) + 3 * t * t * (y3 - y2);
  const len = Math.hypot(dx, dy);

  return { px, py: Y, tx: dx / len, ty: dy / len };
}

// --- Context pixels & inner fillets ---
const canvas = document.getElementById("canvas");
const ctxGroup = document.getElementById("context-pixels");
const filletsPath = document.getElementById("fillets");
const ctxB = document.getElementById("ctx-b");
const ctxBL = document.getElementById("ctx-bl");
const ctxBR = document.getElementById("ctx-br");
const ctxRi = document.getElementById("ctx-ri");
const ctxRiVal = document.getElementById("ctx-ri-val");
const noStrokeCheckbox = document.getElementById("ctx-no-stroke");
const shapePath = document.getElementById("shape");
const canvasRect = document.querySelector("#canvas > rect");
noStrokeCheckbox.addEventListener("change", () => {
  const hide = noStrokeCheckbox.checked;
  shapePath.style.stroke = hide ? "none" : "";
  canvasRect.style.stroke = hide ? "none" : "";
});

function updateContext() {
  const b = ctxB.checked, bl = ctxBL.checked, br = ctxBR.checked;
  const ri = parseFloat(ctxRi.value);

  // Draw context pixel rectangles
  ctxGroup.innerHTML = "";
  const rects = [];
  if (b)  rects.push({ x: 0, y: 1, w: 1, h: 1 });
  if (bl) rects.push({ x: -1, y: 1, w: 1, h: 1 });
  if (br) rects.push({ x: 1, y: 1, w: 1, h: 1 });
  for (const { x, y, w, h } of rects) {
    const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    rect.setAttribute("x", x);
    rect.setAttribute("y", y);
    rect.setAttribute("width", w);
    rect.setAttribute("height", h);
    rect.setAttribute("fill", "var(--svg-shape-fill)");
    ctxGroup.appendChild(rect);
  }

  // Compute inner fillets at concave vertices
  const filletParts = [];
  if (ri > 0) {
    const style = document.getElementById("style-select").value;
    const params = TIP_PROFILES[style];

    // Vertex (0,1): concave "tl" when tip + B + BL on
    if (b && bl) {
      const eA = findTipEdge(1 - ri, params, "left");
      if (eA) {
        const eB = { px: -ri, py: 1, tx: -1, ty: 0 };
        filletParts.push(buildFilletPath(eA.px, eA.py, eA.tx, eA.ty, eB.px, eB.py, eB.tx, eB.ty, 0, 1));
      } else {
        filletParts.push(innerFilletAt(0, 1, "tl", ri));
      }
    }
    // Vertex (1,1): concave "tr" when tip + B + BR on
    if (b && br) {
      const eA = findTipEdge(1 - ri, params, "right");
      if (eA) {
        const eB = { px: 1 + ri, py: 1, tx: -1, ty: 0 };
        filletParts.push(buildFilletPath(eA.px, eA.py, eA.tx, eA.ty, eB.px, eB.py, eB.tx, eB.ty, 1, 1));
      } else {
        filletParts.push(innerFilletAt(1, 1, "tr", ri));
      }
    }
  }
  filletsPath.setAttribute("d", filletParts.join(" "));

  // Keep viewBox fixed — context pixels extend below/beside but framing stays the same
  canvas.setAttribute("viewBox", "-0.12 -0.12 1.24 1.24");
}

ctxB.addEventListener("change", updateContext);
ctxBL.addEventListener("change", updateContext);
ctxBR.addEventListener("change", updateContext);
ctxRi.addEventListener("input", () => {
  ctxRiVal.textContent = parseFloat(ctxRi.value).toFixed(2);
  updateContext();
});

initProfileEditor({
  profiles: TIP_PROFILES,
  lsKey: "qr-custom-tip-profiles",
  defaultStyle: "paw",
  buildPath,
  sliderRange(name) {
    if (name === "lobes") return { min: 0, max: 12, step: 1 };
    if (/(Open|Rotate)$/.test(name)) return { min: -1, max: 1, step: 0.02 };
    return { min: 0, max: 1, step: 0.01 };
  },
  exportPrefix: "tip",
  formatValue: (_k, v) => parseFloat(v.toFixed(2)).toString(),
  onUpdate: updateContext,
});

// Initial context render
updateContext();
</script>
<script src="theme-toggle.js"></script>
</body>
</html>
